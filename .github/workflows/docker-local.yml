name: Docker local startup

on:
  pull_request:
    paths:
      - 'deploy/**'
      - 'scripts/**'
      - 'relayflow-*/**'
      - 'web/**'
      - 'pom.xml'
      - 'lombok.config'
      - '.dockerignore'
      - 'openspec/changes/docker-local-one-command-start/**'
      - '.github/workflows/docker-local.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cold-start-and-restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      COMPOSE_PARALLEL_LIMIT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Config, launcher faults and Compose compatibility
        run: |
          bash -n scripts/*.sh scripts/lib/*.sh scripts/tests/*.sh
          ./scripts/tests/local-config.test.sh
          ./scripts/tests/local-launcher.test.sh
          docker compose -f deploy/compose.yml config --quiet
          docker compose -f deploy/compose.prod.yml config --quiet
          npx --yes @fission-ai/openspec@1.4.1 validate docker-local-one-command-start --strict
      - name: Backend compile and affected tests
        run: |
          ./mvnw -B -ntp -pl relayflow-server -am compile
          ./mvnw -B -ntp -pl relayflow-module-infra/relayflow-module-infra-biz -am test -Dtest=LocalDockerProfileTest,MinioAddressingTest,StorageProviderServiceImplTest -Dsurefire.failIfNoSpecifiedTests=false
      - name: Source builds, empty volumes, API/WS and restore
        run: ./scripts/smoke-local.sh
      - name: Image health checks and WS/SSE proxy regression
        run: |
          ./scripts/tests/server-image.test.sh
          ./scripts/tests/web-image.test.sh
          ./scripts/tests/local-init.test.sh
      - name: Collect redacted diagnostics and stop test projects
        if: always()
        shell: bash
        run: |
          shopt -s nullglob
          for config in "$PWD"/.relayflow/smoke/*/local.env; do
            export RELAYFLOW_LOCAL_ENV_FILE="$config"
            ./scripts/local-status.sh --logs > "${config%/*}/diagnostics.log" 2>&1 || true
            ./scripts/stop-local.sh || true
          done
      - name: Upload only redacted logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-local-redacted-diagnostics
          path: |
            .relayflow/logs/*.log
            .relayflow/smoke/*/diagnostics.log
          if-no-files-found: ignore
          retention-days: 7
