spring:
  application:
    name: relayflow-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/relayflow}
    username: ${POSTGRES_USER:relayflow}
    password: ${POSTGRES_PASSWORD:relayflow}

  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

relayflow:
  tenant:
    enabled: ${RELAYFLOW_TENANT_ENABLED:false}
    default-id: ${RELAYFLOW_TENANT_DEFAULT_ID:1}
    header-name: X-Tenant-Id
    allow-open-register: ${RELAYFLOW_TENANT_ALLOW_OPEN_REGISTER:false}
  cache:
    enabled: true
    default-ttl-seconds: 1800
    null-value-ttl-seconds: 60
    ttl-jitter-seconds: 300
    lock-wait-millis: 3000
    lock-lease-millis: 10000
    permission-ttl-seconds: 1800
  security:
    jwt:
      secret: ${RELAYFLOW_JWT_SECRET:dev-only-change-me-in-production}
      access-token-expire-seconds: 7200
  encrypt:
    aes-key: ${RELAYFLOW_ENCRYPT_AES_KEY:cmVsYXlmbG93LWRldi1hZXMta2V5LWNoYW5nZS1tZSE=}
  storage:
    default-provider: minio
    allow-local: false
    validate-on-startup: true
    minio:
      endpoint: ${RELAYFLOW_MINIO_ENDPOINT:http://127.0.0.1:9000}
      public-endpoint: ${RELAYFLOW_MINIO_PUBLIC_ENDPOINT:}
      region: ${RELAYFLOW_MINIO_REGION:}
      access-key: ${MINIO_ROOT_USER:minioadmin}
      secret-key: ${MINIO_ROOT_PASSWORD:minioadmin}
      bucket: relayflow
      use-ssl: false
      path-prefix: ""
  websocket:
    enable: true
    path: /infra/ws
    sender-type: local
    allowed-origins: "*"
    heartbeat-ttl-seconds: 60
  rtc:
    livekit:
      # Browser connects here directly (not via Java). MUST be reachable from the participant browser
      # (ws://127.0.0.1:7880 only works when the browser runs on the same machine as LiveKit).
      # Distinct from LIVEKIT_NODE_IP (ICE advertisement). See docs/dev/rtc-livekit.md
      url: ${RELAYFLOW_LIVEKIT_URL:ws://127.0.0.1:7880}
      # Optional Room Service HTTP base; defaults from url (ws→http). Used to DeleteRoom on end.
      api-url: ${RELAYFLOW_LIVEKIT_API_URL:}
      api-key: ${RELAYFLOW_LIVEKIT_API_KEY:devkey}
      api-secret: ${RELAYFLOW_LIVEKIT_API_SECRET:secret}
      # Webhook Authorization: Bearer <secret>; defaults to api-secret when blank
      webhook-secret: ${RELAYFLOW_LIVEKIT_WEBHOOK_SECRET:}
      token-ttl-seconds: ${RELAYFLOW_LIVEKIT_TOKEN_TTL_SECONDS:7200}
      room-service-enabled: ${RELAYFLOW_LIVEKIT_ROOM_SERVICE_ENABLED:true}
    token-query-param: token
  task:
    due-remind-window: 24h
  im:
    bot-carrier:
      dm-history-limit: 20
      dm-history-hard-cap: 50
      group-nearby-window: 5
      nearby-hard-cap: 20
      history-max-chars: 8000
      reply-preview-max-chars: 80
  job:
    enabled: ${RELAYFLOW_JOB_ENABLED:false}
    admin-addresses: ${RELAYFLOW_JOB_ADMIN_ADDRESSES:http://127.0.0.1:8090/xxl-job-admin}
    access-token: ${RELAYFLOW_JOB_ACCESS_TOKEN:relayflow-dev-xxl-token}
    executor:
      appname: ${RELAYFLOW_JOB_EXECUTOR_APPNAME:relayflow-server}
      port: ${RELAYFLOW_JOB_EXECUTOR_PORT:9999}
      ip: ${RELAYFLOW_JOB_EXECUTOR_IP:}
      log-path: ${RELAYFLOW_JOB_EXECUTOR_LOG_PATH:logs/xxl-job/jobhandler}
      log-retention-days: 30
