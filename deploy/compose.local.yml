name: ${COMPOSE_PROJECT_NAME:-relayflow-local}

services:
  postgres:
    image: postgres@sha256:972eeb4e0a5fee4c3046cf868896719227e845aa9e38ff79a353efb3b2b2c10a
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-relayflow}
      POSTGRES_USER: ${POSTGRES_USER:?Run scripts/local-config.sh first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Missing persisted database password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -q -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis@sha256:b2b95679e3b46fb51864949ed25ea976fc3a6bcc00a40a1bc00d568cb2822e50
    command: [redis-server, --appendonly, 'yes']
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    image: relayflow-minio:local
    build:
      context: ./minio
      target: minio
    command: [server, /data, --console-address, ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Missing persisted storage user}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Missing persisted storage password}
      MINIO_SITE_REGION: ${RELAYFLOW_MINIO_REGION:-us-east-1}
    ports:
      - '127.0.0.1:${MINIO_API_PORT:-19000}:9000'
    volumes:
      - minio_data:/data
    healthcheck:
      test: [CMD, wget, -q, -T, '2', -O, /dev/null, http://127.0.0.1:9000/minio/health/ready]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  minio-init:
    image: relayflow-mc:local
    build:
      context: ./minio
      target: mc
    entrypoint: [/bin/sh, /init/init-local.sh]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Missing persisted storage user}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Missing persisted storage password}
      RELAYFLOW_MINIO_REGION: ${RELAYFLOW_MINIO_REGION:-us-east-1}
      LOCAL_WEB_PORT: ${LOCAL_WEB_PORT:-18080}
    volumes:
      - ./minio:/init:ro
    depends_on:
      minio:
        condition: service_healthy
    restart: 'no'

  xxl-job-db-init:
    image: postgres@sha256:972eeb4e0a5fee4c3046cf868896719227e845aa9e38ff79a353efb3b2b2c10a
    entrypoint: [/bin/bash, /xxl-job/init-local.sh]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-relayflow}
      POSTGRES_USER: ${POSTGRES_USER:?Missing persisted database user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Missing persisted database password}
    volumes:
      - ./xxl-job:/xxl-job:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  xxl-job-admin:
    image: znle/xxl-job-admin@sha256:c35835025191be1e2a2f81e70ecedd154c73cf9471d0e5f4a4cf73314dda25c6
    environment:
      TZ: Asia/Shanghai
      XXL_JOB_DB_TYPE: postgres
      SPRING_PROFILES_ACTIVE: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/xxl_job
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:?Missing persisted database user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Missing persisted database password}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      # Schema and seeds belong exclusively to xxl-job-db-init.
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
      SPRING_SQL_INIT_MODE: never
      XXL_JOB_ACCESSTOKEN: ${XXL_JOB_ACCESS_TOKEN:?Missing persisted job token}
    command: ['--xxl.job.accessToken=${XXL_JOB_ACCESS_TOKEN:?Missing persisted job token}']
    volumes:
      - xxl_logs:/data/applogs
    depends_on:
      xxl-job-db-init:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD-SHELL, 'wget -q -T 3 -O- http://127.0.0.1:8080/xxl-job-admin/ >/dev/null']
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s
    restart: unless-stopped

  livekit:
    image: livekit/livekit-server@sha256:25cd902de7cacbd5f1f779f6a6ac1eae20ba8f56b0935934ce6b0ab80d1e3d20
    command: [--bind, 0.0.0.0, --node-ip, 127.0.0.1]
    environment:
      LIVEKIT_KEYS: '${RELAYFLOW_LIVEKIT_API_KEY:?Missing persisted RTC key}: ${RELAYFLOW_LIVEKIT_API_SECRET:?Missing persisted RTC secret}'
      LIVEKIT_CONFIG: |
        port: 7880
        rtc:
          tcp_port: ${LIVEKIT_RTC_PORT:-7881}
          udp_port: ${LIVEKIT_UDP_PORT:-7882}
          use_external_ip: false
        logging:
          level: info
    ports:
      - '127.0.0.1:${LIVEKIT_PORT:-7880}:7880'
      - '127.0.0.1:${LIVEKIT_RTC_PORT:-7881}:${LIVEKIT_RTC_PORT:-7881}'
      - '127.0.0.1:${LIVEKIT_UDP_PORT:-7882}:${LIVEKIT_UDP_PORT:-7882}/udp'
    healthcheck:
      test: [CMD-SHELL, 'wget -q -T 2 -O- http://127.0.0.1:7880/ >/dev/null']
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  server:
    image: relayflow-server:local
    build:
      context: ..
      dockerfile: relayflow-server/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: local-docker
      POSTGRES_DB: ${POSTGRES_DB:-relayflow}
      POSTGRES_USER: ${POSTGRES_USER:?Missing persisted database user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Missing persisted database password}
      RELAYFLOW_JWT_SECRET: ${RELAYFLOW_JWT_SECRET:?Missing persisted JWT secret}
      RELAYFLOW_ENCRYPT_AES_KEY: ${RELAYFLOW_ENCRYPT_AES_KEY:?Missing persisted AES key}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Missing persisted storage user}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Missing persisted storage password}
      MINIO_API_PORT: ${MINIO_API_PORT:-19000}
      RELAYFLOW_MINIO_REGION: ${RELAYFLOW_MINIO_REGION:-us-east-1}
      LIVEKIT_PORT: ${LIVEKIT_PORT:-7880}
      RELAYFLOW_LIVEKIT_API_KEY: ${RELAYFLOW_LIVEKIT_API_KEY:?Missing persisted RTC key}
      RELAYFLOW_LIVEKIT_API_SECRET: ${RELAYFLOW_LIVEKIT_API_SECRET:?Missing persisted RTC secret}
      XXL_JOB_ACCESS_TOKEN: ${XXL_JOB_ACCESS_TOKEN:?Missing persisted job token}
      RELAYFLOW_TENANT_ENABLED: ${RELAYFLOW_TENANT_ENABLED:-false}
      RELAYFLOW_TENANT_DEFAULT_ID: ${RELAYFLOW_TENANT_DEFAULT_ID:-1}
      RELAYFLOW_TENANT_ALLOW_OPEN_REGISTER: ${RELAYFLOW_TENANT_ALLOW_OPEN_REGISTER:-false}
    volumes:
      - server_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      xxl-job-admin:
        condition: service_healthy
      livekit:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: relayflow-web:local
    build:
      context: ../web
      dockerfile: Dockerfile
    ports:
      - '127.0.0.1:${LOCAL_WEB_PORT:-18080}:80'
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
  xxl_logs:
  server_logs:
