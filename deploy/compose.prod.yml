# 部署：Docker 跑基础设施 + 后端（relayflow-server）。
# 前端仅在宿主机运行：cd web && pnpm dev（见 README § 开发）。

include:
  - path: compose.yml

services:
  server:
    build:
      context: ..
      dockerfile: relayflow-server/Dockerfile
    container_name: relayflow-server
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-relayflow}
      POSTGRES_USER: ${POSTGRES_USER:-relayflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-relayflow}
      RELAYFLOW_JWT_SECRET: ${RELAYFLOW_JWT_SECRET:-dev-only-change-me-in-production}
      RELAYFLOW_TENANT_ENABLED: ${RELAYFLOW_TENANT_ENABLED:-false}
      RELAYFLOW_TENANT_DEFAULT_ID: ${RELAYFLOW_TENANT_DEFAULT_ID:-1}
      RELAYFLOW_TENANT_ALLOW_OPEN_REGISTER: ${RELAYFLOW_TENANT_ALLOW_OPEN_REGISTER:-false}
      RELAYFLOW_JOB_ENABLED: ${RELAYFLOW_JOB_ENABLED:-true}
      RELAYFLOW_JOB_ADMIN_ADDRESSES: ${RELAYFLOW_JOB_ADMIN_ADDRESSES:-http://xxl-job-admin:8080/xxl-job-admin}
      RELAYFLOW_JOB_ACCESS_TOKEN: ${XXL_JOB_ACCESS_TOKEN:-relayflow-dev-xxl-token}
      RELAYFLOW_JOB_EXECUTOR_APPNAME: ${RELAYFLOW_JOB_EXECUTOR_APPNAME:-relayflow-server}
      RELAYFLOW_JOB_EXECUTOR_PORT: ${RELAYFLOW_JOB_EXECUTOR_PORT:-9999}
      # Empty IP: register container network address for Admin-in-Compose callbacks
      RELAYFLOW_JOB_EXECUTOR_IP: ${RELAYFLOW_JOB_EXECUTOR_IP:-}
    depends_on:
      postgres:
        condition: service_healthy
      xxl-job-admin:
        condition: service_healthy
    ports:
      - "${SERVER_PORT:-8080}:8080"
      - "${RELAYFLOW_JOB_EXECUTOR_PORT:-9999}:9999"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/admin-api/system/tenant/default"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
